[workspace]
resolver = "3"
members = ["crates/docuflow-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
docuflow-core = { path = "crates/docuflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# tauri-specta for Tauri 2 is still a release candidate: keep these three pinned
# to exact, mutually compatible versions (AD-2).
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tracing = "0.1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
