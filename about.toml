# cargo-about config: generates the Rust third-party notices shipped with the
# app (doc §12.2). Run:
#   cargo about generate about.hbs -o THIRD_PARTY_NOTICES_RUST.html
# Keep this list in sync with deny.toml.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "IJG",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
