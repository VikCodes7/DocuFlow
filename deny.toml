# cargo-deny policy (doc §12). Run: cargo deny check
# Any GPL / LGPL / AGPL dependency fails the build.

[graph]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "IJG",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # File-level copyleft used by some of Tauri's transitive dependencies
  # (e.g. cssparser, selectors). Fine as long as those files are unmodified.
  "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# DocuFlow's own crates are unpublished and have no license field yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
